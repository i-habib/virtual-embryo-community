[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-submission-blender"
version = "0.1.0"
description = "Compose complementary Virtual Embryo Challenge submissions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "anndata>=0.10",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vec-blend = "vec_blender.cli:main"

[tool.setuptools.packages.find]
include = ["vec_blender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
