[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-agent-bench"
version = "0.1.0"
description = "Deterministic dry-run tasks for Virtual Embryo Agent Team harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "anndata>=0.10,<0.13",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vec-agent-bench = "vec_agent_bench.cli:main"

[tool.setuptools.packages.find]
include = ["vec_agent_bench*"]
