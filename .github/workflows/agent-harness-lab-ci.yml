name: 'agent-harness-lab: CI'

on:
  push:
    branches: [main]
    paths:
      - 'agent-harness-lab/**'
      - '.github/workflows/agent-harness-lab-ci.yml'
  pull_request:
    paths:
      - 'agent-harness-lab/**'
      - '.github/workflows/agent-harness-lab-ci.yml'

defaults:
  run:
    working-directory: agent-harness-lab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: vec-agent-bench self-test --out /tmp/vec-agent-bench-reference
