name: 'ensemble-lab: Refresh ensemble atlas'

on:
  push:
    branches: [main]
    paths:
      - 'ensemble-lab/ensemble_atlas.py'
      - 'ensemble-lab/atlas_study.py'
      - 'ensemble-lab/requirements.txt'
      - 'ensemble-lab/regime_results/**'
      - '.github/workflows/ensemble-lab-refresh-atlas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ensemble-atlas-main
  cancel-in-progress: true

defaults:
  run:
    working-directory: ensemble-lab

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message || '', '[atlas-results]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Remove superseded atlas outputs
        run: >-
          rm -f
          atlas_results/diagnostic_bins.csv
          atlas_results/diagnostic_correlations.csv
          atlas_results/diagnostic_mean_graft.png
          atlas_results/diagnostic_population_mix.png
          atlas_results/diagnostic_quantile_graft.png
          atlas_results/diagnostic_spatial_transplant.png
          atlas_results/organizer_reference_pairs.csv
          atlas_results/simple_comparators.csv
      - run: python ensemble_atlas.py --regime-dir regime_results --out-dir atlas_results
      - name: Commit current atlas results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ATLAS_RESULTS.md atlas_results/
          if git diff --cached --quiet; then
            echo "No atlas result changes"
          else
            git commit -m "Refresh ensemble atlas [atlas-results] [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
