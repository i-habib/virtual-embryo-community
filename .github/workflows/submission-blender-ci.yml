name: 'submission-blender: CI'

on:
  push:
    branches: [main]
    paths:
      - 'submission-blender/**'
      - '.github/workflows/submission-blender-ci.yml'
  pull_request:
    paths:
      - 'submission-blender/**'
      - '.github/workflows/submission-blender-ci.yml'

defaults:
  run:
    working-directory: submission-blender

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: vec-blend --help
      - name: Full-panel sparse stress test
        run: >-
          python benchmarks/stress_sparse.py
          --cells 10000
          --mean-cells 10000
          --genes 32285
          --density 0.02
