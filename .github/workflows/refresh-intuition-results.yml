name: Refresh Intuition Lab results

on:
  push:
    branches: [main]
    paths:
      - 'intuition-lab/**'
      - '.github/workflows/refresh-intuition-results.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intuition-results-main
  cancel-in-progress: true

jobs:
  execute:
    if: ${{ !contains(github.event.head_commit.message || '', '[intuition-results]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned public scorer and notebook stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/aristoteleo/veckit.git@46d41e63f42a9aab815db20b742feeccd249cb17" matplotlib pandas jupyter nbconvert
      - name: Make Colab-style scratch path available
        run: |
          sudo mkdir -p /content
          sudo chown "$USER":"$USER" /content
      - name: Execute notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace intuition-lab/t1_population_failure_playground.ipynb --ExecutePreprocessor.timeout=900
          jupyter nbconvert --to notebook --execute --inplace intuition-lab/t2_spatial_failure_playground.ipynb --ExecutePreprocessor.timeout=900
          jupyter nbconvert --to notebook --execute --inplace intuition-lab/task3_response_playground.ipynb --ExecutePreprocessor.timeout=900
      - name: Regenerate compact result tables and figures
        run: python intuition-lab/generate_results.py
      - name: Commit refreshed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intuition-lab
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Refresh Intuition Lab results [intuition-results] [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
