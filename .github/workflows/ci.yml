name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile run_lab.py
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -c "from vec_blender import mean_graft, quantile_graft, spatial_transplant; from veckit import score; print('imports ok')"
