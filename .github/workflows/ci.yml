name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest numpy pandas
      - name: Data Safety tests
        run: python -m unittest discover -s data-safety/tests -v
      - name: Metric Lens tests
        run: python -m pytest -q metric-lens/test_metric_lens.py
      - name: External catalog tests
        run: python -m pytest -q external-data-catalog/tests
      - name: Notebook structure and Python syntax
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          notebooks = sorted(Path('.').rglob('*.ipynb'))
          assert notebooks, 'no notebooks found'
          for path in notebooks:
              nb = json.loads(path.read_text(encoding='utf-8'))
              assert nb.get('nbformat') == 4, path
              for i, cell in enumerate(nb.get('cells', [])):
                  if cell.get('cell_type') != 'code':
                      continue
                  src = ''.join(cell.get('source', []))
                  filtered = '\n'.join(line for line in src.splitlines() if not line.lstrip().startswith(('!', '%')))
                  if filtered.strip():
                      try:
                          ast.parse(filtered)
                      except SyntaxError as e:
                          raise AssertionError(f'{path} cell {i}: {e}') from e
              print('ok', path)
          PY
