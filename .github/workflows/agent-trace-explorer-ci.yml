name: 'agent-trace-explorer: CI'

on:
  push:
    branches: [main]
    paths:
      - 'agent-trace-explorer/**'
      - '.github/workflows/agent-trace-explorer-ci.yml'
  pull_request:
    paths:
      - 'agent-trace-explorer/**'
      - '.github/workflows/agent-trace-explorer-ci.yml'

defaults:
  run:
    working-directory: agent-trace-explorer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python examples/build_demo.py
      - run: trace-explorer summary examples/reference.jsonl
