name: Refresh ensemble results

on:
  push:
    branches: [main]
    paths:
      - 'run_lab.py'
      - 'requirements.txt'
      - '.github/workflows/refresh-results.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ensemble-results-main
  cancel-in-progress: true

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message || '', '[ensemble-results]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python run_lab.py --out-dir results
      - name: Commit current results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESULTS.md results/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Refresh ensemble results [ensemble-results] [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
