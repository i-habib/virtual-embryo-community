name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip check
      - name: Unit and synthetic end-to-end tests
        run: python -m pytest -q tests
      - name: Compile processors
        run: python -m py_compile audit_catalog.py vec_external/common.py processors/*.py
      - name: Validate catalog JSON and processor paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path('catalog.json').read_text())
          ids = [x['id'] for x in items]
          assert len(ids) == len(set(ids)), 'duplicate catalog ids'
          for item in items:
              p = Path(item['processor'])
              assert p.exists(), f"missing processor: {p}"
              assert item['source_url'].startswith('https://')
          print(f'validated {len(items)} catalog entries')
          PY
